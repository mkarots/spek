[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# PyPI distribution name (`pip install spek-cli`). The plain `spek` name was
# already taken on PyPI by another package, so we publish under
# `spek-cli`. The Python import name stays `spek` (see [tool.hatch ... wheel]
# below) and the CLI binary stays `spek` (see [project.scripts]); the only
# thing that changes for users is the install command.
name = "spek-cli"
version = "0.1.0"
description = "Agentic spec-to-code builder: turn a SPEC.md into an installable, tested package."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Karotsieris", email = "michael.karotsieris@gmail.com" }]
dependencies = [
  "anthropic>=0.39",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "black>=24.0",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/mkarots/spek"
Repository = "https://github.com/mkarots/spek"
Issues = "https://github.com/mkarots/spek/issues"

[project.scripts]
spek = "spek.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: requires a working Docker daemon; skipped automatically when unavailable",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
